[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftfair"
version = "0.1.0"
description = "Schedule volunteers to shifts so every hard rule holds, hours are spread as evenly as possible, and an impossible schedule comes with the reason."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # CP-SAT's Python API changes between minor versions: stay on 9.15 until checked.
    "ortools>=9.15.6755,<9.16",
]

[project.optional-dependencies]
# Lower bounds are releases at least two weeks old when they were chosen (2026-11-13).
dev = [
    "pytest>=9.2,<10",
    "hypothesis>=6.170.12,<7",
    "ruff>=0.17.3,<0.18",
]

[project.scripts]
shiftfair = "shiftfair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# pyflakes, syntax errors, bugbear, pyupgrade, simplify, import order
select = ["F", "E9", "B", "UP", "SIM", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
